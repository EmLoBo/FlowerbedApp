# Increase JVM heap for Gradle daemon — Android + Kotlin + Compose needs more memory
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle parallel builds
org.gradle.parallel=true

# Enable Gradle build caching
org.gradle.caching=true

# Enable configuration cache (speeds up subsequent builds)
org.gradle.configuration-cache=true

# Kotlin code style
kotlin.code.style=official

# Android specific
android.useAndroidX=true

# Disable Jetifier — not needed since we use AndroidX only
android.enableJetifier=false

# Enable R8 full mode for better shrinking in release builds
android.enableR8.fullMode=true
